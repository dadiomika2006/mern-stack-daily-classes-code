<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       li:first-child{
            background-color: cadetblue;  
        }
        button:first-of-type{
            background-color: aquamarine;
        }
         li:last-child{
            background-color: rgb(231, 113, 209);
            text-align: center;
        }
        button:last-of-type{
            background-color: rgb(228, 191, 97);
        }
        li:nth-child(even){
            background-color: cornflowerblue;
        }
        li:nth-child(2){
            background-color: blueviolet;
            text-align:center;
            width: 250px;
            color: aqua;
            font-weight:bold;
            font-size: 50px;
            font-family: monospace;
            text-decoration-line: underline;
            text-decoration-style: solid;

        }
        input:focus{
            background-color: chartreuse;
            color: aqua;
            font-size: italic;
            font-weight: bold;
            font-family: monospace;
        }
        div{
            height: 150px;
            width: 150px;
            background-color: brown;
        }
        div:hover{
            background-color: rgb(201, 229, 75);
        }
    </style>
</head>
<body>
    <ol>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
    </ol>
    <div>
        <span>span tag</span>
        <button>button-1</button>
        <button>button-2</button>
        <button>button-3</button>
        <button>button-4</button>
        <button>button-5</button>
        <button>button-6</button>
        <button>button-7</button>
    </div>
        
    
</body>
</html>
